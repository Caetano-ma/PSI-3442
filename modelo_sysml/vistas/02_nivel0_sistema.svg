@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "SistemaMissoesAutonomas" as E1  <<(T,blue) part  def>> [[psysml:872fcd06-283f-4bcf-a5d3-24b7a44fbec9 ]] {
rec usage "notebook: NotebookLinux" as E3 [[psysml:a364b883-6560-4ff2-9acf-050744f6e1ed ]] {
rec usage "^usb: PortaUSB  " as E5  <<(T,blue) port>> [[psysml:7aed6ba0-8f84-4a19-b142-96608be4bad6 ]] {
rec usage "^pacote: PacoteDados" as E4  <<(T,blue) item>> [[psysml:7bfa1e89-a936-4899-bb48-ef6b9ceb7c97 ]] {
}
}
}
rec usage "radio: RadioDJI" as E6 [[psysml:c7678852-e65c-49d7-a882-b7acbdbd83db ]] {
rec usage "^usb: PortaUSB  " as E8  <<(T,blue) port>> [[psysml:37f8b98a-718e-4fff-861d-4f93a4d34d37 ]] {
rec usage "^pacote: PacoteDados" as E7  <<(T,blue) item>> [[psysml:7bfa1e89-a936-4899-bb48-ef6b9ceb7c97 ]] {
}
}
rec usage "^rf: PortaRF  " as E10  <<(T,blue) port>> [[psysml:982ca316-d998-46cc-9f39-55abb63eec55 ]] {
rec usage "^pacote: PacoteDados" as E9  <<(T,blue) item>> [[psysml:b96bba2d-fd2b-4829-82dd-8eb7b5358a65 ]] {
}
}
}
rec usage "drone: Drone" as E11 [[psysml:28e32da7-ef3d-44f7-ac10-f27b96f606ac ]] {
rec usage "^rf: PortaRF  " as E13  <<(T,blue) port>> [[psysml:fb8da9a6-414d-4f56-80ff-d7bf8d26172f ]] {
rec usage "^pacote: PacoteDados" as E12  <<(T,blue) item>> [[psysml:b96bba2d-fd2b-4829-82dd-8eb7b5358a65 ]] {
}
}
}
}
note as E2
[[psysml:820af7ae-1178-4026-8ec3-d6be8695f6b8 @]]Função global: ao receber "executar tarefa N", realizar a tarefa N de forma autônoma até o pouso
(Tarefa 1: quadrado de 1,50 m a 1,80 m com quatro permanências de 60 s; Tarefa 2: balões), respeitando
tolerâncias e restrições e registrando evidências; interromper com segurança quando comandado.
end note 
