@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "SistemaMissoesAutonomas" as E1  <<(T,blue) part  def>> [[psysml:6e5765bf-7a99-40e2-84bc-7db741fe4c47 ]] {
rec usage "notebook: NotebookLinux" as E3 [[psysml:1e774864-27e9-4bd6-a5eb-ed46912813b7 ]] {
rec usage "^usb: PortaUSB  " as E5  <<(T,blue) port>> [[psysml:4316f873-3294-49f0-b0cf-2e1c2f95fd83 ]] {
rec usage "^pacote: PacoteDados" as E4  <<(T,blue) item>> [[psysml:e2ccd9bf-79ad-42bc-bc04-a16807115458 ]] {
}
}
}
rec usage "radio: RadioDJI" as E6 [[psysml:4d239e37-7210-402f-9d51-74c5ef48dc90 ]] {
rec usage "^usb: PortaUSB  " as E8  <<(T,blue) port>> [[psysml:fdfb3c49-9da3-494e-8223-e4d8b038f1a1 ]] {
rec usage "^pacote: PacoteDados" as E7  <<(T,blue) item>> [[psysml:e2ccd9bf-79ad-42bc-bc04-a16807115458 ]] {
}
}
rec usage "^rf: PortaRF  " as E10  <<(T,blue) port>> [[psysml:e710b450-1951-49c3-a7e1-48cde6d64861 ]] {
rec usage "^pacote: PacoteDados" as E9  <<(T,blue) item>> [[psysml:5df27b90-e1cf-45de-bba5-93ca2669413a ]] {
}
}
}
rec usage "drone: Drone" as E11 [[psysml:127bda4c-c6ec-41ab-981f-902db043034f ]] {
rec usage "^rf: PortaRF  " as E13  <<(T,blue) port>> [[psysml:6cce7d12-20b0-47a8-986d-041d654483c4 ]] {
rec usage "^pacote: PacoteDados" as E12  <<(T,blue) item>> [[psysml:5df27b90-e1cf-45de-bba5-93ca2669413a ]] {
}
}
}
}
note as E2
[[psysml:e447b5d3-8f57-451e-a332-e0b1e8ed2a4f @]]Função global: ao receber "executar tarefa N", realizar a tarefa N de forma autônoma até o pouso
(Tarefa 1: quadrado de 1,50 m a 1,80 m com quatro permanências de 60 s; Tarefa 2: balões), respeitando
tolerâncias e restrições e registrando evidências; interromper com segurança quando comandado.
end note 
