@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle
skinparam ranksep 10
skinparam rectangle {
 backgroundColor<<block>> LightGreen
}

rec def "SistemaMissoesAutonomas" as E1  <<(T,blue) part  def>> [[psysml:3d364568-e824-449d-b421-015ead4ecf0e ]] {
rec usage "notebook: NotebookLinux" as E3 [[psysml:ba3f8687-0cf6-45b0-a178-cf4a002545af ]] {
rec usage "^usb: PortaUSB  " as E5  <<(T,blue) port>> [[psysml:71ce3b0b-c75e-49d1-80d6-aa72387b2a29 ]] {
rec usage "^pacote: PacoteDados" as E4  <<(T,blue) item>> [[psysml:3a47600a-6a0d-4655-b3ed-02e3284c5cf0 ]] {
}
}
}
rec usage "radio: RadioDJI" as E6 [[psysml:1f0ad1d5-45f1-473d-b825-6062dfb706bc ]] {
rec usage "^rf: PortaRF  " as E8  <<(T,blue) port>> [[psysml:77925da3-3ac3-4563-a926-ddede6133192 ]] {
rec usage "^pacote: PacoteDados" as E7  <<(T,blue) item>> [[psysml:8556f3fa-9faf-4289-88b2-d2cb415c96da ]] {
}
}
rec usage "^usb: PortaUSB  " as E10  <<(T,blue) port>> [[psysml:1f684752-3ad8-43ea-ab35-1c72bcb53e9f ]] {
rec usage "^pacote: PacoteDados" as E9  <<(T,blue) item>> [[psysml:3a47600a-6a0d-4655-b3ed-02e3284c5cf0 ]] {
}
}
}
rec usage "drone: Drone" as E11 [[psysml:9f4235ac-75c5-40fd-ac3d-093f9c8c991e ]] {
rec usage "^rf: PortaRF  " as E13  <<(T,blue) port>> [[psysml:6cc0e0aa-8919-42e9-b095-21b6f9de472f ]] {
rec usage "^pacote: PacoteDados" as E12  <<(T,blue) item>> [[psysml:8556f3fa-9faf-4289-88b2-d2cb415c96da ]] {
}
}
}
}
note as E2
[[psysml:c8db1224-cacf-4bfb-8113-828c72f060ed @]]Função global: ao receber "executar tarefa N", realizar a tarefa N de forma autônoma até o pouso
(Tarefa 1: quadrado de 1,50 m a 1,80 m com quatro permanências de 60 s; Tarefa 2: balões), respeitando
tolerâncias e restrições e registrando evidências; interromper com segurança quando comandado.
end note 
