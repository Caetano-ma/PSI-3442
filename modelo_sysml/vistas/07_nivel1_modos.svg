}

note as E2
[[psysml:8d8b081c-7c02-4d6c-afcc-261ee9133380 @]]Modos globais, comuns às duas tarefas. Cada tarefa é refinada no nível n
(Tarefa 1: NivelN::MaquinaEstadosTarefa1). Critério de progressão do enunciado: a Tarefa 2 só é aceita
em voo real depois de a Tarefa 1 ter sido concluída em voo real.
end note 
note as E7
[[psysml:a5e94ab0-2563-42fc-a9a9-a5a8b827dd5a @]]Pouso no local; nunca retorno por GNSS.
end note 
