}

note as E2
[[psysml:46abdedd-d47f-4ca1-b312-9f3ff385c1e0 @]]Modos globais, comuns às duas tarefas. Cada tarefa é refinada no nível n
(Tarefa 1: NivelN::MaquinaEstadosTarefa1). Critério de progressão do enunciado: a Tarefa 2 só é aceita
em voo real depois de a Tarefa 1 ter sido concluída em voo real.
end note 
note as E7
[[psysml:4e0e6a32-5109-4b70-a942-408905ca3c76 @]]Pouso no local; nunca retorno por GNSS.
end note 
