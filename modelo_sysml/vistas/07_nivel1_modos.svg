@startuml
skin sysmlbw
skinparam monochrome true
skinparam wrapWidth 300
hide circle

rec def "ModosOperacao" as E1  <<(T,blue) state  def>> [[psysml:499fa661-00be-4eb5-9c82-6e7d721585c4 ]] {
rec usage "ocioso" as E3  <<(T,blue) state>> [[psysml:ef5cfc40-338d-4c1a-85c4-3d9c069013ff ]] {
}

rec usage "tarefa1" as E4  <<(T,blue) state>> [[psysml:b1b61bf7-1c25-4809-b0e8-9f551c39a06a ]] {
}

rec usage "tarefa2" as E5  <<(T,blue) state>> [[psysml:4d2e4ccb-9b59-4461-af08-aed01a640ecc ]] {
}

rec usage "terminoSeguro" as E6  <<(T,blue) state>> [[psysml:402aedc0-7762-47da-bf34-d045190e83c4 ]] {
}

desc "ModosOperacao" as E1  : **entry** 
[*] - -> E3 [[psysml:f0f3f88a-2516-479e-920c-74ecc9889233 ]] 
}

note as E2
[[psysml:07733b06-fc63-4b4b-962b-a446268c6143 @]]Modos globais, comuns às duas tarefas. Cada tarefa é refinada no nível n
(Tarefa 1: NivelN::MaquinaEstadosTarefa1). Critério de progressão do enunciado: a Tarefa 2 só é aceita
em voo real depois de a Tarefa 1 ter sido concluída em voo real.
end note 
