path d="M316,6 L316,16 L326,16 L316,6 " fill="#FAFAFA" style="stroke:#181818;stroke-width:1.0;"/><a href="psysml:8d8b081c-7c02-4d6c-afcc-261ee9133380" target="_top" title="psysml:8d8b081c-7c02-4d6c-afcc-261ee9133380" xlink:actuate="onRequest" xlink:href="psysml:8d8b081c-7c02-4d6c-afcc-261ee9133380" xlink:show="new" xlink:title="psysml:8d8b081c-7c02-4d6c-afcc-261ee9133380" xlink:type="simple"><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" text-decoration="underline" textLength="12" x="12" y="24.897">@</text></a><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="270" x="24" y="24.897">Modos globais, comuns às duas tarefas. Cada</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="158" x="12" y="42.603">tarefa é refinada no nível n</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254" x="12" y="60.309">(Tarefa 1: NivelN::MaquinaEstadosTarefa1).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="298" x="12" y="78.0151">Critério de progressão do enunciado: a Tarefa 2 só</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="45" x="12" y="95.7211">é aceita</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299" x="12" y="113.4271">em voo real depois de a Tarefa 1 ter sido concluída</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="73" x="12" y="131.1331">em voo real.</text></g><g id="elem_E7"><path d="M972.5,505 L972.5,532.706 L1247.5,532.706 L1247.5,515 L1237.5,505 L972.5,505 " fill="#FAFAFA" style="stroke:#181818;stroke-width:0.5;"/><path d="M1237.5,505 L1237.5,515 L1247.5,515 L1237.5,505 " fill="#FAFAFA" style="stroke:#181818;stroke-width:1.0;"/><a href="psysml:a5e94ab0-2563-42fc-a9a9-a5a8b8