# Cenário "um único balão-alvo" (seção 7): só vermelho é cor-alvo; permanência oficial de 60 s. Os demais parâmetros
# são os padrões (iguais a tarefas.yaml). Usado na simulação com: tarefa2_gazebo.launch.py baloes:=3 config:=...
tarefa1:
  altura_alvo_m: 1.80
  aresta_m: 1.50
  vertices:
    A: [0.00, 0.00, 1.80]
    B: [1.50, 0.00, 1.80]
    C: [1.50, 1.50, 1.80]
    D: [0.00, 1.50, 1.80]
  sentido: abcd
  tempo_permanencia_s: 60.0
  tol_horizontal_m: 0.30
  tol_vertical_m: 0.10
  v_pairado_max_mps: 0.15
  v_toque_max_mps: 0.50
  v_deslocamento_max_mps: 0.30
  tempo_estabilizacao_s: 2.0
  altura_inicio_pouso_m: 0.30
  altura_min_decolagem_m: 0.50
  tempo_max_preparacao_s: 10.0
  tempo_max_decolagem_s: 20.0

tarefa2:
  cores_alvo: [vermelho]
  tempo_permanencia_s: 60.0
